# Builds Carthage for Windows and Linux when a version tag (v0.2.0, …) is pushed, and publishes
# the builds as a release of this repo, with the version's notes from carthage/whatsnew.py. The
# in-app update check and install.sh look for the latest release here.
name: Release

on:
  push:
    tags: ["v*", "!v*-*"]  # real versions only; test tags (v0.2.0-test) are skipped
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6==6.11.*" pillow numpy psutil pyinstaller

      # The app folder (dist/Carthage) and the installer (dist/Carthage-<version>-setup.exe).
      # Inno Setup 6 comes with GitHub's Windows runners.
      - name: Build
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Zip and name the installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          Compress-Archive -Path dist/Carthage -DestinationPath "Carthage-$v-windows.zip"
          Move-Item dist/Carthage-*-setup.exe "Carthage-$v-windows-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Carthage-windows
          path: |
            Carthage-*-windows.zip
            Carthage-*-windows-setup.exe

  linux:
    # The oldest supported Ubuntu, so the build runs on distros with an older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6==6.11.*" pillow numpy python-xlib pyinstaller

      # dist/Carthage-<version>-x86_64.AppImage and dist/Carthage-<version>-linux.tar.gz
      - name: Build
        run: sh packaging/build_linux.sh python

      - name: Name the builds
        run: |
          v="${{ github.ref_name }}"
          mv dist/Carthage-*-x86_64.AppImage "Carthage-$v-linux-x86_64.AppImage"
          mv dist/Carthage-*-linux.tar.gz "Carthage-$v-linux.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: Carthage-linux
          path: |
            Carthage-*-linux-x86_64.AppImage
            Carthage-*-linux.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ github.ref_name }}"
          python3 -m carthage.whatsnew "${v#v}" > notes.md
          gh release create "$v" Carthage-* --title "Carthage $v" --notes-file notes.md
