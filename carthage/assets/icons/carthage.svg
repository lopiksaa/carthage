<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Carthage</title>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#4b4b51"/><stop offset="1" stop-color="#232327"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb4ff"/><stop offset="0.55" stop-color="#4f7cf0"/><stop offset="1" stop-color="#7a4fe0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.8" y2="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sticker"><rect x="127.7" y="56.1" width="256.6" height="357.8" rx="10.0"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <!-- shadow (light from the top-left) -->
  <rect x="112.7" y="38.0" width="300.7" height="440.0" rx="18.0" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <!-- body, with its visible thickness at the bottom -->
  <rect x="105.7" y="26.0" width="300.7" height="440.0" rx="18.0" fill="#141417"/>
  <rect x="105.7" y="26.0" width="300.7" height="434.0" rx="18.0" fill="url(#shell)"/>
  <rect x="106.7" y="27.0" width="298.7" height="432.0" rx="17.0" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
  <!-- recessed tab on top -->
  <rect x="208.9" y="43.0" width="94.2" height="14.0" rx="5.0" fill="#18181b"/>
  <!-- the sticker: header, art, code strip -->
  <g clip-path="url(#sticker)">
    <rect x="127.7" y="56.1" width="256.6" height="87.2" fill="#1c1c1f"/>
    <rect x="127.7" y="142.3" width="256.6" height="227.5" fill="url(#art)"/>
    <circle cx="321.1" cy="191.4" r="75.2" fill="#ffffff" opacity="0.12"/>
    <circle cx="180.8" cy="346.7" r="95.2" fill="#ffffff" opacity="0.10"/>
    <rect x="127.7" y="369.8" width="256.6" height="45.1" fill="#0b0b0c"/>
    <rect x="127.7" y="56.1" width="256.6" height="357.8" fill="url(#sheen)"/>
  </g>
  <rect x="127.7" y="56.1" width="256.6" height="357.8" rx="10.0" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="1.5"/>
  <!-- header mark: a bold C for Carthage -->
  <path d="M 268.9 83.8 A 20.0 20.0 0 1 0 268.9 114.5" fill="none" stroke="#f4f4f4" stroke-width="8.0" stroke-linecap="round"/>
  <!-- code strip -->
  <g fill="#f0f0f0" opacity="0.85">
    <rect x="180.8" y="387.8" width="40.1" height="8.0" rx="4.0"/>
    <rect x="232.9" y="387.8" width="55.1" height="8.0" rx="4.0"/>
    <rect x="300.1" y="387.8" width="31.1" height="8.0" rx="4.0"/>
  </g>
  <!-- the arrow groove -->
  <path d="M 229.9 425.9 L 282.1 425.9 L 256.0 447.0 Z" fill="#18181b"/>
  <path d="M 229.9 425.9 L 282.1 425.9" stroke="#000" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
